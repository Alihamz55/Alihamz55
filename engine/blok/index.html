<html><head><meta charset="utf-8">
<style>

function gradTex(stops) {
  const c = document.createElement('canvas'); c.width = 4; c.height = 512; const g = c.getContext('2d');

}
function tileTex(base, line, n, noise = 18) {

}
const box = (w, h, d, m, x, y, z, r = 0.06) => { const b = rbox(w, h, d, r, m); b.position.set(x, y, z); scene.add(b); return b; };

function shop(x, z, w, col) {

function tree(x, z, s = 1) {

  trunk.position.set(x, 1.3 * s, z); trunk.castShadow = true; scene.add(trunk);
  const leaf = plain('#4fa350', 0.85), leaf2 = plain('#62b85a', 0.85);
  box(2.8 * s, 1.8 * s, 2.8 * s, leaf, x, 3.3 * s, z, 0.5 * s);
  box(2.1 * s, 1.5 * s, 2.1 * s, leaf2, x + 0.15 * s, 4.6 * s, z + 0.1, 0.45 * s);
  box(1.2 * s, 0.9 * s, 1.2 * s, leaf, x - 0.1, 5.6 * s, z, 0.3 * s);
}
function lamp(x, z) {
  const m = plain('#3d4450', 0.45);
  const p = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.14, 5.2, 10), m); p.position.set(x, 2.6, z); p.castShadow = true; scene.add(p);
  box(0.9, 0.12, 0.16, m, x + 0.4 * Math.sign(-x || 1), 5.15, z, 0.04);
  box(0.6, 0.3, 0.45, plain('#fff4c9', 0.4), x + 0.8 * Math.sign(-x || 1), 5.0, z, 0.06);
}
function playground(x, z) {
  const red = plain('#e0533f', 0.6), yel = plain('#f2c230', 0.6), blue = plain('#3a7bd5', 0.6);
  box(1.6, 2.4, 1.6, blue, x, 1.2, z, 0.1);
  box(1.8, 0.2, 1.8, red, x, 2.5, z, 0.06);
  const sl = box(0.9, 0.14, 3.4, yel, x + 1.6, 1.3, z + 0.2, 0.06); sl.rotation.z = 0; sl.rotation.y = Math.PI / 2; sl.rotation.x = 0;
  sl.rotation.set(0, 0, -0.6); sl.scale.set(1, 1, 1); sl.geometry = new RoundedBoxGeometry(3.4, 0.14, 0.9, 3, 0.06);
}

function world() {
  scene.background = gradTex([[0, '#5aa7ec'], [0.55, '#9fd0f6'], [1, '#e4f3fd']]);
  scene.fog = new THREE.Fog('#d7ecfb', 28, 75);
  const grass = tileTex('#78b95a', null, 1, 26); grass.repeat.set(30, 30);
  const ground = new THREE.Mesh(new THREE.PlaneGeometry(200, 200), new THREE.MeshStandardMaterial({ map: grass, roughness: 0.95 }));
  ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);
  const walk = tileTex('#d4d3cc', '#b5b3aa', 4, 10); walk.repeat.set(20, 1);
  box(80, 0.12, 2.4, new THREE.MeshStandardMaterial({ map: walk, roughness: 0.9 }), 0, 0.06, -4.2, 0.03);
  box(80, 0.12, 2.4, new THREE.MeshStandardMaterial({ map: walk, roughness: 0.9 }), 0, 0.06, -12.4, 0.03);
  box(80, 0.04, 5.8, plain('#4b4f58', 0.9), 0, 0.02, -8.3, 0.01);
  for (let i = -20; i < 20; i++) box(1.6, 0.05, 0.22, plain('#f3f3f3', 0.8), i * 3.2, 0.04, -8.3, 0.02);
  house(-6.2, -17, 5.4, 4.2, '#f4d6a0', '#c8553d');
  house(0, -18.5, 5.8, 4.8, '#a9d6e5', '#3d5a80');
  shop(6.4, -17, 5.2, '#f7f1e3');
  house(12.5, -18, 5.4, 4.2, '#d8c7f0', '#7a5195');
  house(-12.4, -18.5, 5.4, 4.6, '#c7e9b0', '#b5651d');
  tree(-4.6, -2.6, 0.95); tree(4.9, -3.0, 0.9); tree(-9.5, -14, 1.1); tree(9.5, -13.5, 1.0); tree(2.9, -14.5, 0.9);
  lamp(-3.4, -5.6); lamp(3.6, -5.6);
  playground(-7.5, -1.5);
  // pagar rendah
  for (let i = -12; i <= 12; i++) box(0.16, 0.8, 0.16, plain('#ffffff', 0.7), i * 0.9, 0.4, -2.9, 0.04);
  box(22, 0.12, 0.1, plain('#ffffff', 0.7), 0, 0.62, -2.9, 0.03);
}

function label(text, sub, worldPos, cam, size, dy = 0) {
  const v = worldPos.clone().project(cam);
  const d = document.createElement('div'); d.className = 'lab';
  d.style.left = ((v.x + 1) / 2 * W) + 'px'; d.style.top = ((1 - v.y) / 2 * H + dy) + 'px';
  d.style.fontSize = size + 'px'; d.innerHTML = text + (sub ? `<div class="sub">${sub}</div>` : '');
  document.body.appendChild(d);
}

function tilesHTML(word) {
  const cols = ['#e5534b', '#f2a93b', '#3a7bd5', '#4fae5a', '#8c6bff'];
  let k = 0;
  return word.split('').map(ch => ch === ' ' ? '<div class="gap"></div>' :
    `<div class="tile" style="background:${cols[k % 5]};transform:rotate(${(k++ % 2 ? 1 : -1) * (2 + (k % 3))}deg)">${ch}</div>`).join('');
}
if (mode === 'banner') {
  lights(); world();
  house(-19, -18, 5.4, 4.4, '#f7c6c0', '#7a5195'); house(19, -17.5, 5.6, 4.2, '#c0e0f7', '#c8553d');
  tree(-15.5, -12, 1.2); tree(15.5, -11.5, 1.1); tree(-9.5, -4, 1.0); tree(9.5, -4.5, 1.05);
  const sunD = new THREE.Mesh(new THREE.SphereGeometry(3, 32, 16), new THREE.MeshBasicMaterial({ color: '#ffd23f', toneMapped: false, fog: false })); sunD.position.set(22, 22, -60); scene.add(sunD);
  const cl = plain('#ffffff', 0.9);
  [[-18, 15, -40], [-4, 17, -50], [12, 14, -45], [26, 13, -55]].forEach(([x, y, z], i) => { box(6, 2, 2, cl, x, y, z, 0.9); box(3.5, 2.4, 2, cl, x - 1 + i % 2, y + 1, z, 0.9); });
  const r = raka('happy'); r.scale.setScalar(0.86); r.position.set(-6.0, 0, 0.5); r.rotation.y = 0.3; scene.add(r);
  pose(r, -1, -2.9, 0.5); pose(r, 1, 0.05, -0.05);
  const m = mama('gentle'); m.position.set(6.0, 0, 0); m.rotation.y = -0.3; scene.add(m);
  pose(m, 1, 2.9, -0.4); pose(m, -1, -0.05, 0.1);
  const g = guru('gentle'); g.scale.setScalar(0.95); g.position.set(9.2, 0, -3.2); g.rotation.y = -0.5; scene.add(g); pose(g, 1, 0.5, -0.8);
  const t = mamaTV('happy'); t.visible = false;
  const cam = new THREE.PerspectiveCamera(30, W / H, 0.1, 200);
  cam.position.set(0, 3.9, 19); cam.lookAt(0, 3.7, 0);
  renderer.render(scene, cam);
  const d = document.createElement('div'); d.className = 'brand'; d.style.top = '545px';
  d.innerHTML = `<div class="tiles">${tilesHTML('KOTA KOTAK')}</div>
    <div class="tag" style="margin-top:34px">Cerita lucu keluarga kotak-kotak</div>
    <div style="margin-top:14px"><span class="pill">Shorts baru setiap hari</span></div>`;
  document.body.appendChild(d);
  if (Q.get('guide')) { const s = document.createElement('div'); s.style.cssText = `position:absolute;left:${(W - 1546) / 2}px;top:${(H - 423) / 2}px;width:1546px;height:423px;outline:4px dashed #f0f`; document.body.appendChild(s); }
} else if (mode === 'logo') {
  scene.background = (() => { const c = document.createElement('canvas'); c.width = c.height = 800; const g = c.getContext('2d');
    const gr = g.createRadialGradient(400, 330, 40, 400, 400, 560); gr.addColorStop(0, '#fff1a8'); gr.addColorStop(0.35, '#ffd23f'); gr.addColorStop(1, '#f2913b'); g.fillStyle = gr; g.fillRect(0, 0, 800, 800);
    g.save(); g.translate(400, 330); g.fillStyle = 'rgba(255,255,255,0.28)'; for (let i = 0; i < 16; i++) { g.rotate(Math.PI / 8); g.beginPath(); g.moveTo(0, 0); g.lineTo(-60, -620); g.lineTo(60, -620); g.closePath(); if (i % 2) g.fill(); } g.restore();
    const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t; })();
  scene.add(new THREE.HemisphereLight(0xffffff, 0xb08a5a, 1.5));
  const key = new THREE.DirectionalLight(0xfff2dd, 2.0); key.position.set(4, 6, 10); scene.add(key);
  const r = raka('happy'); scene.add(r); pose(r, -1, -2.9, 0.5);
  const cam = new THREE.PerspectiveCamera(30, 1, 0.1, 100); cam.position.set(0.15, 4.75, 7.6); cam.lookAt(0, 4.3, 0);
  renderer.render(scene, cam);
} else if (mode === 'hero') {
  lights(); world();
  const r = raka('smug'); r.scale.setScalar(0.86); r.position.set(-1.85, 0, 0.6); r.rotation.y = 0.25; scene.add(r);
  pose(r, -1, -2.95, 0.55); pose(r, 1, 0.02, -0.05);
  const m = mama('gentle'); m.position.set(1.95, 0, 0); m.rotation.y = -0.25; scene.add(m);
  pose(m, 1, 2.95, -0.2); pose(m, -1, -0.03, 0.1);
  const cam = new THREE.PerspectiveCamera(34, W / H, 0.1, 200);
  cam.position.set(0, 3.0, 25); cam.lookAt(0, 4.6, 0);
  renderer.render(scene, cam);
  label('RAKA', 'anak SMP · narator', new THREE.Vector3(-1.85, -0.3, 0.6), cam, 64);
  label('MAMA RINA', 'presenter cuaca', new THREE.Vector3(1.95, -0.3, 0), cam, 64);
  const t = document.createElement('div'); t.className = 'lab'; t.style.left = '540px'; t.style.top = '120px'; t.style.fontSize = '92px';
  t.innerHTML = 'BADAI RAPOR<div class="sub" style="font-size:38px">contoh tokoh</div>'; document.body.appendChild(t);
} else {
  // lembar ekspresi
  scene.background = gradTex([[0, '#fff4df'], [1, '#ffe0b8']]);
  scene.add(new THREE.HemisphereLight(0xffffff, 0xc9a77a, 1.6));
  const key = new THREE.DirectionalLight(0xfff2dd, 1.8); key.position.set(3, 4, 8); scene.add(key);
  const cam = new THREE.OrthographicCamera(-4.5, 4.5, 8, -8, 0.1, 50); cam.position.set(0, 0, 20); cam.lookAt(0, 0, 0);
  const rows = [
    ['raka', [['smug', 'sok pede'], ['surprised', 'kaget'], ['worried', 'panik']]],
    ['raka', [['sad', 'sedih'], ['confused', 'bingung'], ['laugh', 'ngakak']]],
    ['mama', [['annoyed', 'tegas'], ['gentle', 'lembut'], ['surprised', 'kaget']]],

  ];
  const cfgs = {
    raka: { skin: '#c48a5c', hairColor: '#231914', hair: HAIR.quiff },

    h.scale.setScalar(ri < 2 ? 1.5 : 1.4); const x = (ci - 1) * 2.95, y = [5.4, 2.05, -2.5, -6.2][ri];

  }));
  renderer.render(scene, cam);
  label('RAKA', null, new THREE.Vector3(0, 7.85, 0), cam, 54);
  label('MAMA RINA', null, new THREE.Vector3(0, -0.05, 0), cam, 54);
