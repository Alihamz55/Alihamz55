<!doctype html><html><head><meta charset="utf-8">
<style>
/* Banner YouTube 2560x1440. Area aman (terlihat di semua perangkat): 1546x423 di tengah. */
html,body{margin:0;width:2560px;height:1440px;overflow:hidden}
.tembok{position:absolute;inset:0;background:url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='140'><rect width='220' height='140' fill='%232c2059'/><rect x='5' y='5' width='210' height='60' rx='6' fill='%23463589'/><rect x='-105' y='75' width='210' height='60' rx='6' fill='%233f2f7a'/><rect x='115' y='75' width='210' height='60' rx='6' fill='%234a3a90'/></svg>")}
.gelap{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 45%,transparent 30%,rgba(10,5,35,.7) 100%)}
.sorot{position:absolute;left:50%;top:-40px;width:1700px;height:1100px;transform:translateX(-50%);
  background:linear-gradient(rgba(255,255,255,.34),rgba(255,255,255,.08));
  clip-path:polygon(41% 0,59% 0,100% 100%,0 100%)}
.panggung{position:absolute;left:0;right:0;top:940px;bottom:0;background:linear-gradient(#c8102e,#8f0b20);border-top:14px solid #14101f}
.lantai{position:absolute;left:50%;top:960px;width:1900px;height:150px;transform:translateX(-50%);border-radius:50%;background:rgba(255,255,255,.14)}
.papan{position:absolute;left:50%;top:50%;width:1460px;height:340px;transform:translate(-50%,-50%);
  border-radius:60px;border:16px solid #14101f;box-shadow:16px 20px 0 #14101f;
  background:repeating-linear-gradient(115deg,#e8242c 0 60px,#f0444a 60px 120px);
  display:flex;align-items:center;justify-content:center}
.papan span{font:900 142px "DejaVu Sans","Verdana","Arial Black",sans-serif;color:#fff;white-space:nowrap;letter-spacing:2px;
  -webkit-text-stroke:30px #14101f;paint-order:stroke fill}
</style></head><body>
<div class="tembok"></div><div class="gelap"></div><div class="sorot"></div>
<div class="panggung"></div><div class="lantai"></div>
<div class="papan"><span>MALAM KOMEDI</span></div>
</body></html>
