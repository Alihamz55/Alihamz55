<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@800&display=block" rel="stylesheet">
<style>
html,body{margin:0;width:800px;height:800px;background:transparent}
.bg{position:absolute;inset:0;background:radial-gradient(circle at 50% 35%,#7b5cff 0%,#3a1f9e 55%,#1a0b4d 100%);overflow:hidden}
.beam{position:absolute;top:-60px;width:220px;height:760px;background:linear-gradient(rgba(255,220,140,.55),rgba(255,220,140,0));filter:blur(8px)}
.b1{left:40px;transform:rotate(-18deg)}.b2{right:40px;transform:rotate(18deg)}
.foto{position:absolute;top:50%;width:380px;height:380px;transform:translateY(-50%);border-radius:50%;background-repeat:no-repeat;background-size:900px auto;border:12px solid #fff;box-shadow:0 0 40px rgba(255,200,120,.7)}
.cewek{left:22px;background-image:url(karakter.png);background-position:-273px -320px;box-shadow:0 0 0 9px #ff7fbf,0 0 40px rgba(255,200,120,.7);z-index:2}
.cowok{right:22px;background-image:url(karakter-laki.png);background-position:-283px -307px;box-shadow:0 0 0 9px #5aa9ff,0 0 40px rgba(255,200,120,.7)}
.dot{position:absolute;border-radius:50%;background:#fff3c4;box-shadow:0 0 14px #ffd76a}
.label{position:absolute;bottom:34px;left:50%;transform:translateX(-50%);background:#ff5fa8;color:#fff;font:800 64px 'Baloo 2';padding:0 44px;border-radius:50px;border:8px solid #fff;letter-spacing:1px;white-space:nowrap;line-height:1.25}
</style></head><body>
<div class="bg"><div class="beam b1"></div><div class="beam b2"></div>
<div class="dot" style="left:110px;top:150px;width:18px;height:18px"></div>
<div class="dot" style="left:660px;top:200px;width:14px;height:14px"></div>
<div class="dot" style="left:690px;top:470px;width:20px;height:20px"></div>
<div class="dot" style="left:80px;top:440px;width:12px;height:12px"></div>
</div>
<div class="foto cowok"></div>
<div class="foto cewek"></div>
</body></html>
