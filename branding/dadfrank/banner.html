<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="fonts/fonts.css">
<style>
html,body{margin:0;width:2560px;height:1440px;overflow:hidden}
body{position:relative;background:linear-gradient(#5fb0ff 0%,#bfe6ff 58%,#5fb04a 58%,#3f8a32 100%);font-family:'Fredoka'}
.sun{position:absolute;left:2150px;top:140px;width:260px;height:260px;border-radius:50%;background:#ffe066;box-shadow:0 0 120px #fff3a0}
.cloud{position:absolute;background:#fff;border-radius:80px;opacity:.9}
.fence{position:absolute;left:0;right:0;top:640px;height:240px;background:repeating-linear-gradient(90deg,#fff 0 70px,transparent 70px 120px)}
.fence:after{content:'';position:absolute;left:0;right:0;top:80px;height:34px;background:#fff}
.ch{position:absolute;background-repeat:no-repeat;background-size:contain;background-position:bottom center}
/* area aman YouTube: 1546 x 423 di tengah (507..2053, 508..931) */
.aman{position:absolute;left:507px;top:508px;width:1546px;height:423px;display:flex;align-items:center;justify-content:center}
.panel{background:#fff;border:12px solid #2b1d2a;border-radius:60px;padding:22px 70px 30px;text-align:center;box-shadow:0 16px 0 #2b1d2a;transform:rotate(-1.5deg)}
h1{margin:0;font-weight:700;font-size:150px;line-height:1;color:#d8322f;text-shadow:6px 6px 0 #ffe14a}
h1 span{color:#2f6ad8}
p{margin:10px 0 0;font-weight:600;font-size:54px;color:#2b1d2a}
.pill{display:inline-block;margin-top:16px;background:#2f9a5a;color:#fff;font-weight:700;font-size:42px;padding:4px 36px;border-radius:40px}
</style></head><body>
<div class="sun"></div>
<div class="cloud" style="left:220px;top:180px;width:340px;height:110px"></div>
<div class="cloud" style="left:1250px;top:120px;width:260px;height:90px"></div>
<div class="cloud" style="left:1720px;top:300px;width:300px;height:100px"></div>
<div class="fence"></div>
<div class="ch" style="left:80px;top:420px;width:470px;height:1100px;background-image:url(frank.png)"></div>
<div class="ch" style="left:1980px;top:380px;width:560px;height:1140px;background-image:url(cody.png);transform:scaleX(-1)"></div>
<div class="ch" style="left:560px;top:820px;width:0"></div>
<div class="aman"><div class="panel">
  <h1>Dad <span>Frank</span> Toons</h1>
  <p>Old-school dad. New-school slang.</p>
  <div class="pill">New cartoon Shorts every day</div>
</div></div>
</body></html>
