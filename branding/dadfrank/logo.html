<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="fonts/fonts.css">
<style>
html,body{margin:0;width:800px;height:800px;background:transparent;overflow:hidden}
.bg{position:absolute;inset:0;background:linear-gradient(#7cc4ff 0%,#bfe6ff 52%,#5fb04a 52%,#3f8a32 100%)}
.sun{position:absolute;left:560px;top:70px;width:150px;height:150px;border-radius:50%;background:#ffe066;box-shadow:0 0 60px #fff3a0}
.fence{position:absolute;left:0;right:0;top:330px;height:120px;background:repeating-linear-gradient(90deg,#fff 0 46px,transparent 46px 80px);}
.fence:after{content:'';position:absolute;left:0;right:0;top:40px;height:22px;background:#fff}
.frank{position:absolute;inset:0;background:url(frank.png) no-repeat;background-size:690px auto;background-position:95px 95px}
.label{position:absolute;bottom:150px;left:50%;transform:translateX(-50%) rotate(-3deg);background:#d8322f;color:#fff;font:700 70px 'Fredoka';padding:0 40px;border-radius:60px;border:10px solid #fff;white-space:nowrap;line-height:1.2;box-shadow:0 10px 0 #7a1414}
.label span{color:#ffe14a}
</style></head><body>
<div class="bg"></div><div class="sun"></div><div class="fence"></div><div class="frank"></div>
<div class="label">DAD <span>FRANK</span></div>
</body></html>
