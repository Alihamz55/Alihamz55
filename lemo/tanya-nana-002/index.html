// ───────── dunia: x = bujur, z = −mercator(lintang), y = tinggi (derajat ≈ 111.32 km) ─────────

function heightAt(lon, lat) {                         // tinggi (unit dunia) dari grid lebar

const tex = (u) => new Promise(ok => loader.load(u, t => { t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = renderer.capabilities.getMaxAnisotropy(); ok(t); }));

  const m0 = merc(m.lat0), m1 = merc(m.lat1);

    pos[n * 3 + 1] = hgt[n] / KM + yoff;

};

function greatCircle(a, b, n = 160) {               // titik-titik lintasan great-circle [lon, lat]
  const r = Math.PI / 180, v = ([lo, la]) => [Math.cos(la * r) * Math.cos(lo * r), Math.cos(la * r) * Math.sin(lo * r), Math.sin(la * r)];

    const x = s1 * A[0] + s2 * B[0], y = s1 * A[1] + s2 * B[1], z = s1 * A[2] + s2 * B[2];

// ───────── kamera: kunci (t, lon, lat, jarak, pitch, heading); jarak di ruang log, kubik monoton ─────────

  [0.0, 106.45, -6.05, 4.4, 36, 291],
  [4.5, 106.40, -6.10, 3.8, 39, 292],
  [8.0, 97.0, -1.0, 26, 50, 292],
  [11.5, 81, -6, 118, 64, 293],
  [13.3, 81.5, -6.2, 116, 64, 293],
  [19.0, 80, -5.6, 112, 65, 293],
  [21.8, 79.5, -5.4, 110, 65, 294],

function mono(xs, ys) {                              // Fritsch–Carlson

const KT = KEYS.map(k => k[0]);
const CH = [1, 2, 3, 4, 5].map(c => mono(KT, KEYS.map(k => c === 3 ? Math.log(k[c]) : k[c])));
function camAt(t) {
  const lon = CH[0](t), lat = CH[1](t), D = Math.exp(CH[2](t)), p = CH[3](t) * Math.PI / 180, hd = CH[4](t) * Math.PI / 180;

}
const tmp = new THREE.Vector3();

// ───────── utilitas 2D ─────────

// ───────── label peta: set jauh & set dekat, memudar menurut tinggi kamera ─────────
const LABELS = [

// ───────── subtitle, lencana Nana, merek ─────────

  g.addColorStop(0, 'rgba(8,18,26,0)'); g.addColorStop(0.55, 'rgba(8,18,26,0.55)'); g.addColorStop(1, 'rgba(8,18,26,0.82)');

  const x = 64 * S, y = H - 300 * S;

  ctx.fillStyle = c.who === 'nana' ? '#1FAB89' : AMBER; ctx.fillRect(x, y - 62 * S, 7 * S, 120 * S);

function drawRoute(t) {

}
function drawMeasure(t, D) {
